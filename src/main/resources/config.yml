# ============================================================
#  Villager Defense - konfiguracja
# ============================================================

game:
  min-players: 2
  max-players: 8
  starting-countdown-seconds: 20
  round-break-seconds: 15
  villager-count-per-arena: 3

# Ile punktów za zabicie danego typu moba (im wyższa fala, tym trudniejsze moby)
points-per-kill:
  ZOMBIE: 2
  HUSK: 4
  SKELETON: 5
  WITCH: 7
  VINDICATOR: 9
  RAVAGER: 15
  DEFAULT: 2

# Skalowanie fal: ile mobów spawnuje się w danej rundzie
waves:
  base-mobs: 4
  mobs-per-round: 2
  mobs-per-player: 1
  boss-every-x-rounds: 5

