# Zrzut zaopatrzenia - skrzynia, która może wylądować na arenie podczas gry
supply-drop:
  enabled: true
  # Co ile sekund jest szansa na zrzut (3 minuty = 180 s)
  interval-seconds: 180
  # Szansa na pojawienie się skrzyni w danym interwale (w procentach).
  # Średni czas między zrzutami = interwał / szansa, więc 180 s / 25% = ~12 min.
  # (20% = ~15 min, 30% = ~10 min)
  chance-percent: 25
  # Balon nad skrzynią: LOSOWY stojak o nazwie zaczynającej się od "zrzut_balon_"
  # (np. zrzut_balon_bialy - kolor na końcu nazwy) z całego serwera - 1 losowy
  # kolor na zrzut. Balon znika przy lądowaniu skrzyni.
  # Stojaki budujesz i zapisujesz przez /stojak save <nazwa>.
  # Ile bloków nad skrzynią ma wisieć balon (dół balonu nad górą skrzyni)
  balloon-height: 3
  # Po ilu sekundach skrzynia znika z areny
  lifetime-seconds: 90
  # --- Zasięg areny: prostokąt (min/max) ALBO wielokąt (polygon) ---
  # UWAGA: poniższe wartości (polygon / excluded) to GLOBALNY fallback. Każda arena
  # może mieć WŁASNY teren zrzutu, zapisywany w arenas.yml (arenas.<nazwa>.supply-drop)
  # komendą /def miejsce_zrzutu [arena] ... - wtedy ten plik jest pomijany dla tej areny.
  # min-x/max-x/min-z/max-z = prostokątny zasięg (używany, gdy polygon jest pusty).
  # polygon = dowolny, NIEkwadratowy kształt terenu: lista wierzchołków [x, z]
  # w kolejności dookoła. Skrzynia może wylądować tylko WEWNĄTRZ wielokąta.
  # Punkty najwygodniej dodać w grze, chodząc po granicy terenu (na arenie):
  #   /def miejsce_zrzutu [arena] dodaj          - dodaj wierzchołek w miejscu, w którym stoisz
  #   /def miejsce_zrzutu [arena] dodaj <x> <z>  - dodaj wierzchołek o podanych koordynatach
  #   /def miejsce_zrzutu [arena] usun           - usuń ostatni wierzchołek
  #   /def miejsce_zrzutu [arena] lista          - pokaż wierzchołki
  #   /def miejsce_zrzutu [arena] czysc          - wyczyść wielokąt (wraca prostokąt min/max)
  #   /def miejsce_zrzutu [arena] podglad        - biała chmura (partikle CLOUD) przy KAŻDYM
  #                                                wierzchołku, na Twojej wysokości, 20 s
  # DZIURY w terenie: lista WIELOKĄTÓW, w których zrzut NIGDY nie wyląduje (np. każde
  # jezioro, góra albo wioska osobno - może być ich wiele). Działają też, gdy główny
  # teren to prostokąt min/max. Każda dziura to osobny wielokąt. Komendy:
  #   /def miejsce_zrzutu [arena] dziura nowa         - zacznij NOWĄ dziurę
  #   /def miejsce_zrzutu [arena] dziura dodaj [x z]  - wierzchołek bieżącej (ostatniej) dziury
  #   /def miejsce_zrzutu [arena] dziura usun [numer] - ostatni wierzchołek, albo cała dziura nr <numer>
  #   /def miejsce_zrzutu [arena] dziura czysc        - usuń wszystkie dziury
  #   /def miejsce_zrzutu [arena] dziura lista        - pokaż wszystkie dziury
  #   /def miejsce_zrzutu [arena] dziura podglad [numer] - CZERWONE partikle danej dziury (20 s)
  # Uwaga: woda i lawa są zawsze pomijane - zrzut nigdy nie ląduje na wodzie/lawie.
  # Stary format (jedna płaska lista punktów) jest czytany automatycznie.
  excluded: []
  # Test: /def zrzutdrop <arena>.
  polygon: []
  world: ""
  min-x: -50
  max-x: 50
  min-z: -50
  max-z: 50

# Strojnik stojaka (/stojak) - trwałe przesunięcie stawiania.
# Ustawiane komendą /stojak offset <x> <y> <z>; te wartości przetrwają
# restart serwera. Dotyczy wszystkich sposobów stawiania (place, item,
# saveitem). Np. 0.5 0 0.5 stawia wieżyczki na krawędzi bloku.
stojak:
  offset:
    x: 0.0
    y: 0.0
    z: 0.0
  # Wieżyczka staje DOKŁADNIE tam, gdzie gracz celuje (nie na środku bloku):
  # X/Z z punktu trafienia celownika, więc można postawić ją na krawędzi bloku.
  # false = centrowanie do środka bloku (jak pozostałe stojaki).
  turret-place-at-aim: true
  # Dynamiczny tick wieżyczek: gdy na serwerze stoi jednocześnie DUŻO wieżyczek,
  # ich obsługa (namierzanie, obrót, strzały) jest odświeżana rzadziej, żeby nie
  # obciążać serwera. Prędkość obrotu pozostaje taka sama (limit kąta skaluje się
  # z interwałem), więc różnica jest ledwo zauważalna.
  #   liczba wieżyczek <= threshold-2 -> co 1 tick (jak zawsze)
  #   liczba wieżyczek >  threshold-2 -> co 2 ticki
  #   liczba wieżyczek >  threshold-4 -> co 4 ticki
  # Próg ustawiony na 0 wyłącza dany stopień (zostaje interwał niższego).
  turret-dynamic-tick:
    enabled: true
    threshold-2: 25
    threshold-4: 50

# Zegar ze stojaka (/stojak): stojak o nazwie „zegar_wskazowki" (custom name,
# /stojak nazwij) z TRZEMA częściami-wskazówkami - część 1 = godzinna (30° co
# godzinę), część 2 = minutowa (6° co minutę), część 3 (np. red_concrete) =
# sekundowa (6° co sekundę). Zegar startuje, gdy arena się rozpocznie, a po jej
# zakończeniu wskazówki wracają do stanu początkowego.
zegar:
  # Nazwa stojaka-zegara (custom name). Tab podpowiada nazwy przy /stojak.
  name: zegar_wskazowki
  # Wskazówki obracają się parametrem SKRĘT (tryb SUGAR, rotZ) - dokładnie tym
  # samym, którym stroisz je w /stojak, więc zegar działa tak samo dla tarczy na
  # ścianie, jak i na ziemi (wystarczy ustawić wskazówki skrętem na pozycję 12).
  # Kierunek obrotu wskazówek. Domyślnie true (odwrócony - wskazówki kręcą
  # się w drugą stronę). Jeśli wolisz poprzedni kierunek, ustaw false.
  reverse: true
  # Wyśrodkowanie wskazówek na osi stojaka - WYŁĄCZONE domyślnie: wskazówki
  # mogą być celowo oddalone od stojaka, a przy obrocie skrętem (rotZ) część
  # kręci się wokół WŁASNEGO środka, więc plugin NIE rusza ich pozycji (żeby
  # nie „teleportowały" się do stojaka przy teście / starcie areny). Włącz
  # (true) tylko, gdy wskazówki stoją blisko stojaka i chcesz, żeby plugin
  # sam wycentrował ich środek na osi stojaka (X = 0). Po grze wskazówki
  # wracają dokładnie tam, gdzie je ustawiłeś.
  center: false
  # Styl „zamiatający": wszystkie wskazówki idą PRAWDZIWYMI kątami zegara, bez
  # przycinania do 10° - sekundowa 6° co sekundę, minutowa 6° co minutę,
  # godzinna 30° co godzinę (pełne koło 12 -> 3 -> 6 -> 9 -> 12); na każdej
  # ćwiartce (90°) stara wskazówka „znika", a w tym samym miejscu pojawia się
  # NOWA - druga kopia części (tworzona automatycznie), która obraca się dalej
  # swobodnie parametrem SKRĘT.
  # W tym samym momencie, w którym wskazówka się obraca, część dostaje drobne
  # przesunięcie w kierunku chodu (rośnie równo od 0 do 0.05 na ćwiartkę):
  # 12->3 idzie skosem (+X i +Y, np. wysokość -1 -> -0.95 i przesunięcie X
  # +4.47 -> +4.52), 3->6 tylko -Y, 6->9 tylko -X, 9->12 tylko +Y. Kolejne
  # ćwiartki ciągną się po sobie (nowa wskazówka startuje tam, gdzie poprzednia
  # skończyła); na powrocie do 12 cykl zaczyna się od nowa od pozycji bazowej.
  # false = zwykły zegar (płynny obrót).
  sweep: false
  # Prędkość podglądu /stojak zegar test: ile razy przyspieszyć ruch wskazówek
  # (1 s rzeczywista = tyle s symulowanych). Domyślnie 1.0 = normalna prędkość,
  # prawdziwe tempo 1:1 (sekundowa pełne koło w 60 s). Większa liczba = szybszy
  # podgląd (np. 2.5 = pełne koło sekundowej w 24 s).
  test-speed: 1.0

leaderboard:
  top-size: 10

# Tabliczki rotacji map (typ [vd:map:*]): pula budowana sama ze wszystkich
# gotowych aren-szablonów (tryb instancji + ustawione spawny). Biała lista poniżej
# ogranicza, które szablony mogą się wylosować: pusta lista = wszystkie gotowe
# szablony; wpisane nazwy = tylko one (wielkość liter bez znaczenia). Czytana
# na bieżąco - zmiana + /def reload działa od razu, bez restartu serwera.
rotation:
  auto-maps: []

# System instancji: gdy arena jest oznaczona jako szablon (/def instancja <arena> on),
# każda grupa graczy dołączająca do niej trafia do OSOBNEJ kopii mapy. Kopia (klon
# świata, WorldCreator.copy) jest tworzona w locie, a po zakończeniu gry usuwana -
# szablon zostaje nietknięty. Uwaga: klonowanie dużego świata potrafi na chwilę
# zamrozić serwer (to operacja synchroniczna) - rób małe mapy.
instances:
  # Maksymalna liczba RÓWNOCZESNYCH instancji jednego szablonu (0 = bez limitu).
  max-per-template: 5
