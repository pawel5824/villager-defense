# ============================================================
#  Villager Defense - konfiguracja
# ============================================================

# Nazwa świata Raft (auto-generowany przy starcie pluginu)
raft-world-name: "RAFT"

# Datapack "raft-height" — limity wysokości świata Raft (Y -64..287, height=352).
# Domyślnie WYŁĄCZONE i to celowo, bo mechanika ma dwie twarde pułapki:
#   1) Datapack nadpisuje wymiar typu minecraft:overworld, a ten typ dzielą WSZYSTKIE
#      światy NORMAL na serwerze (raft, lobby, most, pustynna, overworld, hub) —
#      więc obniża sufit nie tylko Raftowi.
#   2) Zmiana height obejmuje też ISTNIEJĄCE światy (sprawdzone w sandboxie: świat
#      utworzony przy 384 wczytuje się potem jako 352), więc każdy blok powyżej Y 287
#      w którymkolwiek świecie NORMAL jest tracony.
# Budowania w górę na Raftcie pilnuje sam plugin (raft.build-height-limit, domyślnie
# 280 = sufit 280), więc do rozgrywki ten datapack nie jest potrzebny.
# Włącz (true) świadomie — najlepiej razem z generowaniem świata Raft od nowa.
# Po włączeniu plugin pisze datapack do <level-name>/datapacks/raft-height (tylko ten
# folder czyta serwer) i loguje na starcie, czy limity faktycznie działają.
raft-height-datapack: false

# Maksymalna liczba graczy w jednej sesji Raft (wspólny świat).
# Przy 3 graczach ich chunki nakładają się — obciążenie jak dla 1-2 graczy.
# Ustaw 0 bez limitu (niezalecane przy wielu sesjach naraz).
raft-max-party-size: 3

# Faza 2: maksymalna liczba tratw w jednym świecie — zabezpieczenie przed
# gromadzeniem się tratw (np. po awariach/restartach). Osierocone encje tratw
# i tak są sprzątane cyklicznie co minutę; ten limit tylko nie pozwala tworzyć
# nowych, gdy świat jest zawalony. 0 = bez limitu.
raft-max-rafts-per-world: 100

# Faza 4: maksymalna liczba komórek (desek) na JEDNĄ tratwę. Każda komórka to
# 3 encje (BlockDisplay + marker + shulker-kolizja), więc limit chroni serwer
# przed tratwą o tysiącach encji. 150 komórek = ~450 encji — dużo, ale przy
# LOD/freeze zamrożone tratwy prawie nic nie kosztują.
raft-max-cells-per-raft: 150

# Przerwa (/przerwa <minuty>). Podczas pauzy moby areny są zamrożone i nie
# można ich bić ani zabijać (PauseListener). Poniższa opcja wycisza dodatkowo
# dźwięki mobów z fali i wieśniaków, żeby przerwa była cicha.
pause:
  # true = gracze nie słyszą dźwięków zamrożonych mobów podczas przerwy
  mute-mob-sounds: true

# Podpora piętra (item `wooden_support`, kategoria „Inne" w GUI młota): płotek
# rozciągnięty w pionie, stawiany NA NAROŻNIKU 4 komórek („na końcu 4 bloków").
# Świadomie ZERO kolizji i JEDNA encja na podporę (BlockDisplay/ItemDisplay) —
# podpora jest wizualem, który „trzyma" piętro, a zasady pięter pilnuje
# RaftBuildListener (patrz docs/RAFT_BALANCE.md §1b). Zmiany działają po
# restarcie serwera albo /def reload (bez rekompilacji).
raft-support:
  # Wysokość słupka w blokach (2 = pokój wysokości 2 kratek między pokładem
  # a piętrem). Model płotka ma 1.5 bloka, więc skala Y = height / 1.5.
  height-blocks: 2.0
  # Materiał wizualu (BlockDisplay). Domyślnie płotek; działa każdy blok.
  material: OAK_FENCE
  # Custom model z Blockbencha (jak latarenki): > 0 przełącza wizual na
  # ItemDisplay z przedmiotem `model-item` o tym custom_model_data. W paczce
  # dodaj definicję assets/minecraft/items/<model-item>.json (range_dispatch po
  # custom_model_data) + model z Blockbencha (origin = środek podstawy kratki,
  # wysokość 1 blok — renderer skaluje go do height-blocks). 0 = zwykły blok.
  custom-model-data: 0
  # Przedmiot bazowy dla custom modelu (tylko gdy custom-model-data > 0).
  model-item: OAK_FENCE
  # BELKI PODPIĘTRZA (build v42): rama z belek na krawędziach każdej komórki
  # piętra, tuż pod nią (wierzch słupka + 4 belki = kratownica rozchodząca się
  # od podpory na 4 komórki wokół niej). Bez tego platforma piętra wyglądała
  # na wiszącą w powietrzu. false = brak belek (mniej encji).
  beams: true
  # Materiał belek — NAJLEPIEJ PEŁNY BLOK (deski, cegły): belka to spłaszczony
  # blok 1 × 0.25 × 0.25. Płotek/murek też zadziała (renderer kompensuje model
  # 1.5 bloka), ale inne kształty (płyty, schody) rozjadą się wizualnie.
  beam-material: DARK_OAK_PLANKS
  # RUNIĘCIE PIĘTRA (build v44): komórki bez podparcia (po zdjęciu podpory albo
  # rozbiciu komórki pod nimi) znikają dopiero po tylu tickach — 12 = 0,6 s,
  # 0 = natychmiast. Każda zawalona komórka wypada do wody jako przedmiot do
  # odzyskania (1× jej materiał) + dźwięk i cząsteczki.
  collapse-delay-ticks: 12

# Faza 8: custom_model_data przedmiotu Hak. Przedmiot to WĘDKA (FISHING_ROD),
# żeby klient rysował linkę od ręki do spławika. Na razie brak własnego modelu
# (waniliowa wędka); gdy powstanie — dodaj próg CMD w
# assets/minecraft/items/fishing_rod.json.
raft-hook-custom-model-data: 8010

# Diagnostyka tratwy w konsoli/logach. Gdy true, KAŻDA tratwa w trybie FULL
# (gracz na pokładzie lub blisko) wypisuje co sekundę linię "[Raft] diag ..."
# z pozycją, prędkością, prądem, powierzchnią wody i pomiarem offsetu kolizji.
# Zostaw false na produkcji — przy kilku tratwach to dziesiątki linii na minutę.
# Włącz na true tylko do debugowania fizyki/kolizji. Zmiany działają po
# restarcie serwera albo /def reload (bez rekompilacji).
raft-debug-diag: false

# Kolizja tratwy z lądem — ześlizg wzdłuż wysp/skał/brzegu przy dotknięciu.
# Zmiany działają po restarcie serwera albo /def reload (bez rekompilacji).
#   probe-gaps   - odległości próbek (w blokach) PRZED krawędzią tratwy, na
#                  wysokości linii wody. Pierwsza = wykrycie „dotknięcia",
#                  dalsze = wcześniejsze wykrycie (tratwa zaczyna zwalniać,
#                  zanim wjedzie w ląd). Możesz dodać więcej wartości.
#   slide-speeds - tabela „kąt prądu (stopnie) → % normalnej prędkości dryfu"
#                  podczas ześlizgu wzdłuż brzegu. Kąt 0° = prąd prosto
#                  w wyspę (tratwa praktycznie stoi), 90° = prąd wzdłuż brzegu
#                  (pełny dryf, nic się nie zmienia). Między punktami prędkość
#                  jest wyliczana liniowo. Domyślna tabela odpowiada przedziałom:
#                  1-10°→7%, 11-20°→18%, 21-30°→29%, 31-40°→40%, 41-50°→51%,
#                  51-60°→62%, 61-70°→73%, 71-80°→84%, 81-89°→95%, 90°→100%.
raft-collision:
  probe-gaps:
    - 0.4
    - 1.0
  slide-speeds:
    0: 0
    5.5: 7
    15.5: 18
    25.5: 29
    35.5: 40
    45.5: 51
    55.5: 62
    65.5: 73
    75.5: 84
    85: 95
    90: 100

# Pole śmieci oceanicznych PRZED tratwą (zbieranie ręczne / sieć / beczki).
# Manager UTRZYMUJE przed dziobem stałą liczbę POJEDYNCZYCH przedmiotów
# (między min-items-ahead a max-items-ahead): gdy jest ich mniej niż dolny
# pułap, dosypuje po jednej sztuce w losowym miejscu 40–70 bloków przed
# dziobem — raz z lewej, kilka kratek dalej z prawej, potem na środku (bez
# sztywnych rzędów). Przedmioty mogą wypaść blisko siebie, a czasem jeden na
# drugim — generator nie wymusza odstępów. Cel uzupełnienia jest losowany
# z przedziału min..max, więc ilość bywa różna (nie zawsze 28), ale nigdy nie
# spada poniżej minimum ani nie przekracza maksimum. Zmiany po /def reload.
raft-debris:
  # Czy pole śmieci ma być utrzymywane (false = wyłączone)
  enabled: true
  # Dolny pułap: ile przedmiotów/beczek ma być przed dziobem (gdy mniej — dosypujemy)
  min-items-ahead: 13
  # Górny pułap: nigdy nie więcej niż tyle przed tratwą
  max-items-ahead: 28
  # Okno spawnu przed dziobem (bloki) — 40–70 jak w oryginalnym generatorze
  nearest-dist: 40.0
  farthest-dist: 70.0
  # Maks. boczne rozrzucenie OD ŚRODKA TRATWY (bloki) — przedmioty mogą
  # pojawić się aż tyle bloków w lewo i w prawo od środka pokładu
  lateral-spread: 14.0
  # Szansa (%), że pojedynczy obiekt to beczka z lootem zamiast przedmiotu
  barrel-chance-percent: 6
  # Szansa (%), że pojedynczy obiekt to DUŻA beczka (custom model, CMD 4003).
  # Łapana hakiem i przez wejście w nią; ma WŁASNĄ tabelę lootu
  # (BIG_BARREL_LOOT w OceanDebrisManager — na razie pusta).
  big-barrel-chance-percent: 1.5
  # Obiekty dalej niż tyle bloków ZA dziobem znikają (nie zaśmiecają oceanu)
  behind-cleanup-dist: 25.0
  # Maks. pojedynczych sztuk dosypanych w jednym sprawdzeniu (co 2 s)
  max-items-per-fill: 6

# Muzyka trybu Raft: losowe utwory z paczki raft-hud z losowymi przerwami.
# Utwory dodajesz w paczce (assets/raft/sounds/music/*.ogg + sounds.json),
# a tu tylko wpisujesz ich identyfikatory. Każdy gracz ma OSOBNE ustawienia
# (/muzyka): włączona, głośność, ton/prędkość, częstotliwość — zapisywane
# w raft-players.yml. Zmiany po /def reload.
raft-music:
  # Globalny włącznik — domyślnie FALSE, dopóki w paczce nie ma plików .ogg
  # (assets/raft/sounds/music/*.ogg). Bez nich gra wysyła pusty dźwięk i klient
  # loguje "Unable to play empty soundEvent" (muzyka i tak nie zagra).
  # Po dodaniu utworów ustaw true — lista i przerwy działają od razu.
  enabled: false
  # Krótsza przerwa między utworami (sekundy) — pełne losowanie min..max
  interval-min-seconds: 180
  # Dłuższa przerwa między utworami (sekundy)
  interval-max-seconds: 480
  # Opóźnienie pierwszego utworu po wejściu do świata Raft (sekundy)
  start-delay-seconds: 45
  # Domyślna głośność dla graczy, którzy jej nie zmieniali (0.0–1.0)
  default-volume: 1.0
  # Domyślny ton/prędkość (1.0 = oryginał; zakres gracza 0.5–2.0)
  default-pitch: 1.0
  # ── Tryb „natychmiastowo”: utwór gra DO KOŃCA, a następny rusza od razu ──
  # Serwer nie zna długości dźwięku (wie ją tylko klient), więc bierze ją
  # z pierwszego dostępnego źródła:
  #   1) track-seconds poniżej — ręcznie, w sekundach (wygrywa),
  #   2) plików .ogg z pack-dir — dokładnie, z nagłówka Vorbisa,
  #   3) default-track-seconds — gdy utworu nie ma w żadnym z powyższych.
  # pack-dir = katalog paczki (ten z pack.mcmeta i folderem assets/); pusty =
  # nie czytamy plików. Ścieżka bezwzględna albo względna do katalogu serwera.
  pack-dir: ""
  # Długość przyjmowana, gdy nie da się jej ustalić (sekundy).
  default-track-seconds: 180
  # Ręczne długości utworów (sekundy) — wygrywają z odczytem z plików. Przykład:
  # track-seconds:
  #   "raft:music.utwor_1": 50
  #   "raft:music.utwor_2": 50
  # Identyfikatory utworów — MUSZĄ zgadzać się z keys w sounds.json paczki
  # DOKŁADNIE ZNAK W ZNAK (kropka, nie ukośnik: wanilia też pisze music.game).
  # Klucz "music.spokojna_zatoka" → id "raft:music.spokojna_zatoka"
  #                          → plik assets/raft/sounds/music/spokojna_zatoka.ogg
  # Błąd w id (np. "raft:music/spokojna_zatoka") = klient nie zna zdarzenia
  # i NIC nie zagra (w logu klienta "Unable to play unknown soundEvent").
  tracks:
    - "raft:music.utwor_1"
    - "raft:music.utwor_2"

# Lobby serwera: dokąd trafiają gracze po /hub, /lobby oraz po automatycznym
# restarcie (/def restart). Ustawisz je w grze komendą /def ustawlobby (stań
# w miejscu i wpisz) albo edytując te wartości. Puste world = pierwszy świat.
lobby:
  world: ""
  x: 0.0
  y: 80.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# Styl wyświetlania HP mobów nad głową:
#   bar    - kwadraciki + liczby, np. "§a████████§7██ [20/20]"
#   hearts - serca, np. "§a❤ 20|20"
health-display-style: bar

# Krytyczne obrażenia bez podskoku: każde trafienie gracza ma szansę
# (chance-percent) stać się ciosem krytycznym - zadaje bonusowe obrażenia
# (damage-multiplier) i nie odrzuca moba (no-knockback), jak waniliowy kryt z wyskoku.
crits:
  chance-percent: 4.0
  damage-multiplier: 1.5
  no-knockback: true
  # Krytyczne obrażenia ze strzał (łucznik i inne klasy strzelające łukiem/kuszą):
  # osobna szansa i mnożnik dla pocisków (strzały, trójzęby).
  ranged-enabled: true
  ranged-chance-percent: 4.0
  ranged-damage-multiplier: 1.5
  # Szczęście na łuku/kuszy/procy: za każde 3 bloki strzału dodaje
  # 3/4/5/6/7% szansy na kryta zależnie od poziomu (I-V).
  ranged-luck-blocks-per-step: 3.0
  ranged-luck-bonus-by-level:
    - 3.0
    - 4.0
    - 5.0
    - 6.0
    - 7.0
  # Zaklęcie Szczęście (w sklepie = Fortune, fortune_1) na broni zwiększa szansę
  # na kryta o tyle % za poziom: miecz/siekiera/trójząb (cios wręcz) albo łuk/kusza
  # (strzał). Rzucany trójząb NIE dostaje bonusu - Szczęście na trójzębie działa
  # tylko jako cios wręcz.
  luck-bonus-per-level: 5.0
  # Szczęście na zbroi: każdy poziom na hełmie/klacie/spodniach/butach dodaje
  # tyle % szansy na kryta. Poziomy ze wszystkich czterech części SUMUJĄ się
  # (np. pełny zestaw z Fortune I = +10%).
  armor-luck-bonus-per-level: 2.5
  # Efekt cząsteczek przy trafieniu krytycznym (czerwone iskry + magiczny połysk)
  particle-enabled: true
  particle-count: 20

# Ciernie (Thorns) na zbroi graczy - tryb "tylko odbicie":
# gdy mob z areny uderzy gracza, odbicie Cierni zadaje obrażenia WYŁĄCZNIE mobowi
# false = waniliowe zachowanie Cierni.
# chance-per-level: szansa (w %) na odbicie za KAŻDY poziom Cierni zsumowany
# z całej zbroi (max 100%). Np. 7 = Ciernie I na jednej części -> 7% na uderzenie,
# Ciernie I na 4 częściach -> 28%, Ciernie III na 4 częściach -> 84% (7 x 12 = 84).
thorns:
  reflect-only: true
  chance-per-level: 7

# Obrażenia łuku: SUMA obrażeń od naciągu + od dystansu lotu strzały.
#   draw-immediate / draw-medium / draw-max - obrażenia od naciągu łuku
#     (0% / 50% / 100% naciągu); między wartościami jest płynne przejście.
#   distance - progi odległości (max-dist w blokach): obrażenia dystansowe
#     DODAWANE do obrażeń od naciągu. Np. strzał z pełnego naciągu z 8-12 bloków
#     = 4.5 + 2.3 = 6.8 obrażeń.
#   Finalnie całość mnoży zaklęcie Power (jeśli łuk je ma), a kryt z sekcji
#   crits (ranged) mnoży wynik jeszcze raz.
bow-damage:
  enabled: true
  draw-immediate: 1.0
  draw-medium: 2.5
  draw-max: 4.5
  distance:
    - {max-dist: 3, damage: 1.0}
    - {max-dist: 7, damage: 1.8}
    - {max-dist: 12, damage: 2.3}
    - {max-dist: 17, damage: 3.0}
    - {max-dist: 2147483647, damage: 3.7}

game:
  min-players: 2
  max-players: 8
  starting-countdown-seconds: 20
  # Gdy w trakcie odliczania do startu wejdzie kolejny gracz do poczekalni,
  # licznik od razu skraca się do tej wartości (np. z 20s na 10s).
  # Ustaw 0, żeby wyłączyć przyspieszanie (licznik zawsze = starting-countdown-seconds).
  countdown-shortened-seconds: 10
  round-break-seconds: 10
  villager-count-per-arena: 3

# Poziomy trudności aren - każdy poziom ma WŁASNĄ liczbę fal do zwycięstwa
# (widoczną na pasku jako "Fala: X/Y"). Poziom areny ustawiasz komendą:
#   /def trudnosc <arena> <latwy|normalny|trudny>
# Domyślny poziom nowych aren to normalny (500 fal). Możesz też dodać tutaj
# WŁASNE poziomy (dowolna nazwa) i użyć ich w komendzie.
difficulties:
  latwy:
    waves: 250
  normalny:
    waves: 500
  trudny:
    waves: 750

# Ile punktów za zabicie danego typu moba (im wyższa fala, tym trudniejsze moby)
points-per-kill:
  ZOMBIE: 2
  HUSK: 4
  SKELETON: 5
  WITCH: 7
  VINDICATOR: 9
  RAVAGER: 50
  PIGLIN_BRUTE: 15
  DEFAULT: 2

# Punkty za zabójstwa WIERZYCZKI: gracz, który postawił wieżyczkę, dostaje
# ten procent normalnej wartości (zaniżone), zaokrąglony W DÓŁ do pełnej liczby
# (min. 1 pkt). Np. 70 = 30% mniej: zombie (2 pkt) -> 1 pkt, ravager (50 pkt) -> 35 pkt.
turret-kill-points-percent: 70

# Efekt szczęścia (LUCK) - bonusy na czas jego trwania:
#   - szansa na bonusowe punkty za zabójstwa mobów zależy od poziomu:
#     I 12%, II 24%, III 36%, IV 48%, V 60% (bezpośrednie i przez wieżyczki gracza),
#   - bonusy sumują się z poziomem: I +1, II +2, III +4, IV +6, V +9 pkt,
#   - szansa na Regenerację po otrzymaniu obrażeń (z dowolnego źródła).
luck:
  points-chance-percent-by-level: [12, 24, 36, 48, 60]
  points-bonus-by-level: [1, 2, 4, 6, 9]
  regen-chance-percent: 8         # szansa na regenerację po otrzymaniu obrażeń (na trafienie)
  regen-level: 1                  # poziom regeneracji (1 = Regeneracja II)
  regen-duration-seconds: 3       # czas trwania regeneracji w sekundach

# Skalowanie fal: ile mobów spawnuje się w danej rundzie
waves:
  # --- Liczba mobów w fali: segmenty z resetami ---
  # Gra podzielona jest na SEGMENTY fal. Na początku każdego segmentu liczba mobów
  # resetuje się do base-count, a potem rośnie losowo: w każdej fali mob ma 50%
  # szans na +1 i 50% na +2 moby (albo 1, albo 2 moby więcej - nigdy +2 co falę).
  # Dzięki temu po spokojnych falach robi się tłoczno (np. fala 15 = średnio ~24
  # moby, od 17 do 31), a od fali 16 liczba wraca do 4 - fale nie puchną
  # w nieskończoność.
  # Każdy segment: od której fali (from-wave), ile fal trwa (length) i ile mobów
  # na starcie (base-count).
  mob-count-segments:
    - {from-wave: 1, length: 15, base-count: 3}    # fale 1-15: spokojne, start od 3 mobów
    - {from-wave: 16, length: 10, base-count: 4}   # fale 16-25: reset do 4 mobów
    - {from-wave: 26, length: 15, base-count: 5}   # fale 26-40: reset do 5 mobów, lepsza zbroja
  # Po ostatnim zdefiniowanym segmencie fale idą automatycznie dalej: kolejne
  # segmenty po mob-count-tail-length fal, a base-count rośnie o 1 w każdym
  # (fale 41-50 od 6 mobów, 51-60 od 7, 61-70 od 8, ...) - o 1 zombiaka więcej
  # niż w poprzednim segmencie.
  mob-count-tail-length: 10
  # Sposób rozstawiania mobów przy spawnie:
  #   point  - dokładnie w ustawionych punktach
  #   random - losowy rozrzut w obrębie mob-spawn-radius (moby rozproszone)
  #   grid   - idealna siatka: moby obok siebie, każdy dokładnie 1 blok od drugiego
  mob-spawn-mode: random
  # Promień rozrzutu dla trybu random (w blokach). 0 = dokładnie w punktach.
  mob-spawn-radius: 5
  # W trybie grid: dopiero gdy w fali jest CO NAJMNIEJ tyle mobów, ustawiają się
  # w idealną siatkę co 1 blok; przy mniejszej liczbie pojawiają się losowo
  # (jak w trybie random). Np. 11 = siatka dopiero powyżej 10 mobów.
  grid-min-mobs: 11

