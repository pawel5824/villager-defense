# Zasady klas - jedno miejsce, w którym mówimy, co dana klasa może, a czego nie.
#
# ETAP 2: sklep już blokuje zakup wg shop-allow/shop-deny - pozycja zostaje
# widoczna, ale ma czerwony opis "Nie dla Twojej klasy". Listy use-* to na razie
# definicje; blokada użycia przedmiotów dojdzie osobno.
# Kategorie "Jedzenie", "Inne" i "Zaklęcia" są wyłączone z zasad klas -
# tam każda klasa kupuje bez ograniczeń, niezależnie od wpisów niżej.
#
# Nowa klasa = nowa sekcja pod "classes"; kodu nie trzeba zmieniać.
# Pusta lista = brak ograniczenia z tej strony.
#
# Kolejność sprawdzania użycia przedmiotu:
#   1. use-except - zawsze dozwolone (np. własna broń klasy),
#   2. use-allow  - jeśli niepuste, tylko te materiały,
#   3. use-deny   - zabrane na końcu.
# Dla zakupów: shop-allow (whitelist ID wpisów sklepu) i shop-deny.
# "*" w ID = dowolny fragment, wielkość liter bez znaczenia.
#
# "@nazwa" oznacza grupę materiałów z sekcji "groups".

version: 1

# Grupy materiałów - używane w regułach jako @nazwa.
# Jedno miejsce na przedmiot, żeby nie powtarzać list w każdej klasie.
groups:
  swords:
    - WOODEN_SWORD
    - STONE_SWORD
    - COPPER_SWORD
    - IRON_SWORD
    - GOLDEN_SWORD
    - DIAMOND_SWORD
    - NETHERITE_SWORD
  axes:
    - WOODEN_AXE
    - STONE_AXE
    - IRON_AXE
    - GOLDEN_AXE
    - DIAMOND_AXE
    - NETHERITE_AXE
  ranged:
    - BOW
    - CROSSBOW
    - TRIDENT
  potions:
    - POTION
    - SPLASH_POTION
    - LINGERING_POTION
  arrows:
    - ARROW
    - SPECTRAL_ARROW
    - TIPPED_ARROW
  shields:
    - SHIELD
  food:
    - BREAD
    - BAKED_POTATO
    - COOKED_PORKCHOP
    - COOKED_BEEF
    - COOKED_MUTTON
    - COOKED_CHICKEN
    - COOKED_RABBIT
    - GOLDEN_CARROT
    - GOLDEN_APPLE
    - ENCHANTED_GOLDEN_APPLE

# Reguły per klasa. ID musi być takie samo jak w KitManager
# (wojownik, lucznik, tank, magik, medyk, assassin, inzynier).
classes:

  wojownik:
    # Mikstury maga/medyka nie mają jeszcze osobnych ID w sklepie. Gdy powstaną,
    # wpisz je w shop-deny (np. "mikstura_maga_*"). Wspólnych nie ruszaj, bo
    # wojownik dostaje od nas miksturę siły.
    use-deny: []
    shop-except:
      # Zwykła i widmowa strzała są dostępne dla każdej klasy.
      - "arrow"
      - "spectral_arrow"
    shop-deny:
      # Broń dystansowa: wojownik ma tylko procę (nie łuk/kuszę/karabin).
      - "bow"
      - "crossbow"
      - "karabin"
      - "*arrow*"

  lucznik:
    # Sztylet łucznika to WOODEN_SWORD pod własną nazwą, dlatego jest wyjątkiem.
    use-except:
      - WOODEN_SWORD
    use-deny:
      - "@swords"
      - "@axes"
    shop-deny:
      - "*_sword"
      - "*_axe"
      # Tarcza jest tylko dla tanka, wojownika i inżyniera.
      - "shield"

  tank:
    use-deny: []
    shop-except:
      - "arrow"
      - "spectral_arrow"
    shop-deny:
      # Proca jest tylko dla łucznika, wojownika, asasyna i inżyniera.
      - "proca"
      - "*arrow*"

  magik:
    use-deny:
      - "@swords"
      - "@axes"
    shop-except:
      - "arrow"
      - "spectral_arrow"
    shop-deny:
      - "*_sword"
      - "*_axe"
      - "shield"
      - "proca"
      - "*arrow*"

  medyk:
    use-deny:
      - "@swords"
      - "@axes"
    shop-except:
      - "arrow"
      - "spectral_arrow"
    shop-deny:
      - "*_sword"
      - "*_axe"
      - "shield"
      - "proca"
      - "*arrow*"

  assassin:
    use-deny: []
    shop-except:
      - "arrow"
      - "spectral_arrow"
    shop-deny:
      # Tylko proca z broni dystansowej + tarcza jest niedostępna.
      - "bow"
      - "crossbow"
      - "karabin"
      - "shield"
      - "*arrow*"

  inzynier:
    use-deny: []
    shop-except:
      - "arrow"
      - "spectral_arrow"
    shop-deny:
      # Tylko proca z broni dystansowej; tarczę może kupić.
      - "bow"
      - "crossbow"
      - "karabin"
      - "*arrow*"
